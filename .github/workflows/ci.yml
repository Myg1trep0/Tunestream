name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install backend dependencies
      run: |
        cd Tunestream-backend
        npm ci || npm install

    - name: Install and build admin portal
      run: |
        cd Tunestream-admin
        npm ci || npm install
        npm run build

    - name: Install and build client app
      run: |
        cd Tunestream-home
        npm ci || npm install
        npm run build
